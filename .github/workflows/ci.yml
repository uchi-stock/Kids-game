name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.27.0
    with:
      # 単一パッケージ（リポジトリルート直下、Vite + Vanilla JS）構成のため、
      # frontend/backend固定ジョブではなくpackagesモードで実行する。
      packages: '[{"dir":".","build":true,"node_version":"22"}]'
      # dev-standards submoduleへのsymlink（commitlint.config.cjs等）の
      # 欠落・リンク切れ・.gitignoreの内容乖離をCIで検知する。
      # 副作用として、他のテストジョブのcheckoutもsubmoduleを取得するように
      # なる（reusable-ci.yml側の挙動）。
      enable_standards_check: true
      # ドキュメント間の相対リンク（README.md・CLAUDE.md）が実際に存在する
      # ファイルを指しているかを検証する（bamiyanapp/dev-standards#603）。
      enable_dead_link_check: true
      dead_link_check_paths: "README.md\nCLAUDE.md"
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
